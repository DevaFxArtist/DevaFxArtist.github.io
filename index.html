<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deva | FX Artist</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell"></div>
  <main class="container" id="app" aria-live="polite"></main>

  <button id="adminAccessBtn" class="glass-button admin-access">Owner Edit Mode</button>

  <section id="adminPanel" class="admin-panel hidden" aria-label="Admin customizations">
    <header class="admin-header">
      <h2>Admin Mode</h2>
      <p>All changes are stored in local storage as JSON-ready data.</p>
      <div class="admin-actions">
        <button class="glass-button" id="exportBtn">Export JSON</button>
        <button class="glass-button" id="resetBtn">Reset Defaults</button>
        <button class="glass-button" id="logoutBtn">Logout</button>
      </div>
    </header>
    <div id="adminControls" class="admin-controls"></div>
  </section>

  <dialog id="authDialog" class="auth-dialog">
    <form method="dialog" id="authForm" class="auth-form glass-card">
      <h3>Owner Authentication</h3>
      <p>Enter owner password to enable edit mode.</p>
      <label for="passwordInput">Password</label>
      <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
      <p id="authError" class="auth-error" role="alert"></p>
      <menu>
        <button value="cancel" class="glass-button">Cancel</button>
        <button id="authSubmit" value="default" class="glass-button">Unlock</button>
      </menu>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button id="closeLightbox" class="glass-button close-lightbox" aria-label="Close preview">×</button>
    <img id="lightboxImage" alt="" />
    <p id="lightboxCaption"></p>
  </dialog>

  <script src="script.js" type="module"></script>
</body>
</html>
