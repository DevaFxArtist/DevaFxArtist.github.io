<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deva | FX Artist</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell"></div>
  <main id="app" class="container" aria-live="polite"></main>

  <div id="floatingActions" class="floating-actions">
    <button id="adminAccessBtn" class="glass-button" type="button">Owner Edit Mode</button>
    <button id="themeBtn" class="glass-button hidden" type="button">Theme</button>
    <button id="exportBtn" class="glass-button hidden" type="button">Export JSON</button>
    <button id="logoutBtn" class="glass-button hidden" type="button">Logout</button>
  </div>

  <div id="editPopover" class="edit-popover hidden" role="dialog" aria-label="Inline editor"></div>

  <dialog id="authDialog" class="auth-dialog">
    <form method="dialog" id="authForm" class="auth-form glass-card">
      <h3>Owner Authentication</h3>
      <p>Enter owner password to enable edit mode.</p>
      <label for="passwordInput">Password</label>
      <input id="passwordInput" name="password" type="password" required />
      <p id="authError" class="auth-error" role="alert"></p>
      <menu>
        <button value="cancel" class="glass-button">Cancel</button>
        <button value="default" class="glass-button">Unlock</button>
      </menu>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button id="closeLightbox" class="glass-button close-lightbox" aria-label="Close preview">×</button>
    <img id="lightboxImage" alt="" />
    <p id="lightboxCaption"></p>
  </dialog>

  <script src="script.js" type="module"></script>
</body>
</html>
